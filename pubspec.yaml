name: divyesh_portfolio
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  persistent_bottom_nav_bar: ^6.0.0
  http: ^1.6.0
  cached_network_image: ^3.4.1
  syncfusion_flutter_pdfviewer: ^33.1.44
  flutter_launcher_icons: ^0.13.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  dio: ^5.4.0
  share_plus: ^10.1.0 # Recommended for iOS "Save to Files"
  font_awesome_flutter: ^11.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  image_path: "assets/app_icon.png"
  # Optional: Use a specific background color for Android Adaptive Icons
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
